<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="robots" content="noindex" />
  <title>Offline - Gold Billing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #0a0a0f; color: #f0f0f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    }
    .card {
      width: 100%; max-width: 420px; text-align: center; background: #16161f; border: 1px solid #2a2a3a;
      border-radius: 18px; padding: 36px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    }
    .icon { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; display: block; }
    h1 { font-size: 22px; font-weight: 800; color: #d4a843; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: #8888a8; margin-bottom: 22px; }
    button {
      min-height: 46px; width: 100%; border: none; border-radius: 10px; background: #d4a843; color: #111;
      font-size: 15px; font-weight: 700; cursor: pointer; touch-action: manipulation;
    }
    button:active { background: #b8922e; }
    .status { margin-top: 14px; font-size: 12px; color: #55556a; min-height: 16px; }
  </style>
</head>
<body>
  <main class="card" role="alert">
    <img class="icon" src="/icons/icon-192x192.png" alt="Gold Billing" width="72" height="72" />
    <h1>You're offline</h1>
    <p>Gold Billing needs an internet connection to load your customers and bills. Please check your Wi-Fi or mobile data and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <script>
    var statusEl = document.getElementById("status");
    function retry() {
      statusEl.textContent = "Checking connection...";
      fetch("/manifest.webmanifest", { cache: "no-store" })
        .then(function () { window.location.href = "/"; })
        .catch(function () { statusEl.textContent = "Still offline. Please try again."; });
    }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", function () { window.location.href = "/"; });
  </script>
</body>
</html>
